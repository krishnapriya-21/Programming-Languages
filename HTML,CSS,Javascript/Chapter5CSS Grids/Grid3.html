<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Cards & Gallery</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    /* Auto-responsive cards — no media queries needed! */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .card {
      background: #f0f0f0;
      border: 1px solid #ccc;
      padding: 1rem;
      text-align: center;
    }

    /*
     * auto-fill: create as many columns as fit
     * minmax(280px, 1fr): each column min 280px, max equal share
     * Result: 1 col on mobile, 2–3 on tablet, 4+ on desktop
     */

    /* Image gallery — masonry-like */
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 200px;
      gap: 8px;
    }

    .gallery div {
      background: #ddd;
      border: 1px solid #aaa;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .gallery .wide  { grid-column: span 2; }
    .gallery .tall  { grid-row: span 2; }
  </style>
</head>
<body>

  <h2>Auto-Responsive Card Grid</h2>
  <div class="card-grid">
    <div class="card">Card 1</div>
    <div class="card">Card 2</div>
    <div class="card">Card 3</div>
    <div class="card">Card 4</div>
    <div class="card">Card 5</div>
    <div class="card">Card 6</div>
  </div>

  <h2>Masonry-Like Gallery</h2>
  <div class="gallery">
    <div>Box A</div>
    <div class="wide">Wide Box</div>
    <div>Box B</div>
    <div class="tall">Tall Box</div>
    <div>Box C</div>
    <div>Box D</div>
    <div>Box E</div>
  </div>

</body>
</html>
