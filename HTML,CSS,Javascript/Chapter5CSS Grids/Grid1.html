<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid Example</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .container {
      display: grid;

      /* === Column definitions === */
      /* Option 1: fixed + two equal */
      /*  grid-template-columns: 200px 1fr 1fr; */

      /* Option 2: 3 equal columns */
       /* grid-template-columns: repeat(3, 1fr); */

      /* Option 3: responsive auto-fill */
       grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 

      /* === Row definitions === */
      grid-template-rows: auto 1fr auto; /* header, main, footer */

      /* === Gaps between cells === */
      gap: 20px;          /* shorthand for row + column gap */
      row-gap: 16px;      /* vertical spacing */
      column-gap: 24px;   /* horizontal spacing */

      min-height: 100vh;
    }

    header {
      grid-column: 1 / -1; /* span all columns */
      background: #4CAF50;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    main {
      grid-column: 1 / -1; /* span all columns */
      display: grid;
      grid-template-columns: inherit; /* reuse container’s column setup */
      gap: inherit;
      padding: 1rem;
    }

    .box {
      background: #f0f0f0;
      padding: 1rem;
      border: 1px solid #ccc;
    }

    footer {
      grid-column: 1 / -1; /* span all columns */
      background: #333;
      color: white;
      padding: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>Header Area</header>
    <main>
      <div class="box">Content Block 1</div>
      <div class="box">Content Block 2</div>
      <div class="box">Content Block 3</div>
      <div class="box">Content Block 4</div>
      <div class="box">Content Block 5</div>
    </main>
    <footer>Footer Area</footer>
  </div>
</body>
</html>
