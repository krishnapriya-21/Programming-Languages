<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom Checkbox & Tooltip Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      padding: 40px;
    }

    /* Custom checkbox using ::before */
    .checkbox-input { display: none; }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 1rem;
    }
    .checkbox-label::before {
      content: '';
      width: 20px; height: 20px;
      border: 2px solid #ccc;
      border-radius: 4px;
      transition: background 0.2s, border-color 0.2s;
    }
    .checkbox-input:checked + .checkbox-label::before {
      background: #264DE4;
      border-color: #264DE4;
      content: '\2713'; /* ✓ */
      color: white;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Tooltip using ::before */
    .has-tooltip {
      position: relative;
      cursor: pointer;
      display: inline-block;
      margin-top: 40px;
      font-weight: bold;
      color: #264DE4;
    }
    .has-tooltip::before {  /* tooltip text */
      content: attr(data-tooltip); /* reads from HTML attribute */
      position: absolute;
      bottom: 100%; left: 50%;
      transform: translateX(-50%);
      background: #111;
      color: white;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 13px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .has-tooltip:hover::before { opacity: 1; }
  </style>
</head>
<body>
  <h1>Custom Checkbox & Tooltip Examples</h1>

  <!-- Custom checkbox -->
  <div>
    <input type="checkbox" id="check1" class="checkbox-input">
    <label for="check1" class="checkbox-label">Accept Terms</label>
  </div>

  <!-- Tooltip -->
  <div class="has-tooltip" data-tooltip="This is a helpful tooltip!">
    Hover over me
  </div>
</body>
</html>
