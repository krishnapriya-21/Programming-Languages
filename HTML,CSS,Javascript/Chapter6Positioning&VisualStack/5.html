<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z-Index Modal Demo</title>
  <style>
    /* Typical z-index scale */
    :root {
      --z-base:    1;
      --z-dropdown: 100;
      --z-sticky:  200;
      --z-overlay: 300;   /* modal backdrop */
      --z-modal:   400;   /* modal content */
      --z-toast:   500;   /* notifications */
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
      background: #f4f4f4;
      text-align: center;
    }

    .open-modal-btn {
      padding: 12px 24px;
      background: #264DE4;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    /* Modal backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;           /* shorthand for top/right/bottom/left: 0 */
      background: rgba(0,0,0,0.5);
      z-index: var(--z-overlay);
      display: none;
    }

    /* Modal content */
    .modal {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: var(--z-modal);
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      display: none;
      max-width: 400px;
    }

    .close-btn {
      margin-top: 20px;
      padding: 8px 16px;
      background: #264DE4;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Z-Index Modal Example</h1>
  <button class="open-modal-btn" onclick="openModal()">Open Modal</button>

  <!-- Backdrop -->
  <div class="modal-backdrop" id="modalBackdrop"></div>

  <!-- Modal -->
  <div class="modal" id="modalBox">
    <h2>Modal Window</h2>
    <p>This modal sits above the backdrop thanks to z-index values.</p>
    <button class="close-btn" onclick="closeModal()">Close</button>
  </div>

  <script>
    function openModal() {
      document.getElementById('modalBackdrop').style.display = 'block';
      document.getElementById('modalBox').style.display = 'block';
    }
    function closeModal() {
      document.getElementById('modalBackdrop').style.display = 'none';
      document.getElementById('modalBox').style.display = 'none';
    }
  </script>
</body>
</html>
