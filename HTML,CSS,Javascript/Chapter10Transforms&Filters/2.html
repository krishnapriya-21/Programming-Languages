<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Flip Card Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
    }

    /* Enable 3D on the parent */
    .card-wrapper {
      perspective: 1000px;        /* depth of 3D space */
    }

    /* 3D flip card effect */
    .card {
      position: relative;
      width: 300px;
      height: 200px;
      transform-style: preserve-3d;
      transition: transform 0.6s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: rotateY(180deg); /* flip horizontally */
    }

    .card-front,
    .card-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden; /* hide back when facing away */
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: white;
    }

    .card-front {
      background: #264DE4; /* blue side */
    }

    .card-back {
      background: #E44D26; /* orange side */
      transform: rotateY(180deg);
    }
  </style>
</head>
<body>
  <div class="card-wrapper">
    <div class="card">
      <div class="card-front">Front</div>
      <div class="card-back">Back</div>
    </div>
  </div>
</body>
</html>
