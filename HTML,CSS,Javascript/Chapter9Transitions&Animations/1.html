<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Button Demo</title>
  <style>
    /* Button styling */
    .btn {
      background: #264DE4;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      /* OR: transition: all 0.2s ease; */
    }

    .btn:hover {
      background: #1a3bc4;
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(38,77,228,0.3);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: none;
    }

    /* Spring effect example */
    .spring {
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Page layout */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Animated Button Example</h1>
    <button class="btn">Hover Me</button>
    <br><br>
    <button class="btn spring">Spring Effect</button>
  </div>
</body>
</html>
