<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animation Demo</title>
  <style>
    /* Loading spinner */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e5e7eb;
      border-top-color: #264DE4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
    }

    /* Pulse (like a heartbeat) */
    @keyframes pulse {
      0%, 100% { transform: scale(1);   opacity: 1; }
      50%       { transform: scale(1.1); opacity: 0.8; }
    }
    .live-dot {
      width: 12px; height: 12px;
      background: #e53935;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 2s ease-in-out infinite;
      margin: 20px;
    }

    /* Fade in */
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .fade-text {
      font-size: 1.2rem;
      color: #333;
      animation: fadeIn 1s ease forwards;
      margin: 20px;
    }

    /* Shake (error feedback) */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .input-error {
      border: 2px solid #e53935;
      padding: 8px;
      border-radius: 4px;
      animation: shake 0.4s ease;
      margin: 20px;
    }

    /* Skeleton loading placeholder */
    @keyframes shimmer {
      from { background-position: -200% 0; }
      to   { background-position: 200% 0; }
    }
    .skeleton {
      width: 100%;
      height: 20px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
      margin: 10px 0;
    }

    /* Layout */
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      padding: 40px;
      text-align: center;
    }
    h1 {
      color: #264DE4;
      margin-bottom: 30px;
    }
    .section {
      margin-bottom: 40px;
    }
  </style>
</head>
<body>
  <h1>CSS Animation Showcase</h1>

  <div class="section">
    <h2>Loading Spinner</h2>
    <div class="spinner"></div>
  </div>

  <div class="section">
    <h2>Pulse / Live Dot</h2>
    <div class="live-dot"></div>
  </div>

  <div class="section">
    <h2>Fade In Text</h2>
    <div class="fade-text">Hello, I faded in smoothly!</div>
  </div>

  <div class="section">
    <h2>Shake Input (Error Feedback)</h2>
    <input type="text" class="input-error" placeholder="Invalid input">
  </div>

  <div class="section">
    <h2>Skeleton Loading Placeholder</h2>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</body>
</html>
